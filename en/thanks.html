<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you, request received | Astroploy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/site.css">
<style>
body{background:var(--soft);min-height:100vh;display:grid;place-items:center;padding:24px}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:44px 32px;max-width:560px;text-align:center}
.box img{height:30px;width:auto;margin:0 auto 22px}
.box h1{font-size:clamp(30px,5vw,44px);margin-top:18px}
.box p{color:var(--muted);margin-top:14px;font-size:17px}
.box .btn{margin-top:26px}
.box .more{font-size:14px;margin-top:20px}.box .more a{text-decoration:underline}
</style>
</head>
<body>
<div class="box">
  <img src="../img/logo-black.png" alt="Astroploy">
  <span class="tag"><i></i>Request received</span>
  <h1>Thank you, we're on <span class="ac">your video.</span></h1>
  <p>Your request has reached us. You'll get our reply within 24 hours at the email address you gave, with the next steps.</p>
  <a class="btn dark" href="./">Back to the site →</a>
  <p class="more">In the meantime: <a href="./#work">watch our examples again</a></p>
</div>
</body>
</html>
