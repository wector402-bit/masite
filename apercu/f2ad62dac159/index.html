<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#02060f;color:#eaf4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

video{width:100%;height:100%;object-fit:contain;background:#02060f}video.cache{visibility:hidden}video::-webkit-media-controls{display:none!important}

[hidden]{display:none!important}@media print{body{display:none}}</style></head><body>
<div id="z"><video id="p" class="cache" playsinline webkit-playsinline disablepictureinpicture disableremoteplayback controlslist="nodownload noremoteplayback noplaybackrate" preload="auto"></video>
<div id="v"><button id="b" hidden aria-label="Lire la vidéo"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button><div id="m" role="status">Chargement…</div></div>
<button id="f" hidden>Plein écran</button></div>
<noscript>Activez JavaScript pour regarder la vidéo.</noscript>
<script>
(()=>{const $=i=>document.getElementById(i),p=$('p'),m=$('m'),b=$('b'),f=$('f'),v=$('v');let pret=false;
const stop=e=>{e.preventDefault();e.stopPropagation()};['contextmenu','dragstart','selectstart','copy'].forEach(n=>document.addEventListener(n,stop,true));
const cache=t=>{if(!pret)return;p.pause();f.style.opacity=1;p.classList.add('cache');b.hidden=false;m.textContent=t||''};
const joue=()=>{if(!pret)return;p.classList.remove('cache');b.hidden=true;f.style.opacity=0;m.textContent='';p.play().catch(()=>cache('Touchez pour lire la vidéo.'))};
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='printscreen'||((e.ctrlKey||e.metaKey)&&['s','p','u'].includes(k))){e.preventDefault();cache('Lecture en pause.')}else if((k===' '||k==='k')&&pret){e.preventDefault();p.paused?joue():cache('')}});
document.addEventListener('keyup',e=>{if(e.key==='PrintScreen')cache('Lecture en pause.')});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cache('Lecture en pause.')});window.addEventListener('blur',()=>cache('Lecture en pause.'));
v.addEventListener('click',()=>{if(pret)(p.paused||p.ended)?joue():cache('')});
p.addEventListener('ended',()=>{f.style.opacity=1;b.hidden=false;m.textContent='Revoir la vidéo'});
const fs=()=>document.fullscreenElement||document.webkitFullscreenElement;
f.addEventListener('click',e=>{e.stopPropagation();const z=$('z');fs()?(document.exitFullscreen||document.webkitExitFullscreen).call(document):(z.requestFullscreen||z.webkitRequestFullscreen).call(z)});
if(top!==self){m.textContent='Ouvrez le lien directement.';return}
const u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
(async()=>{try{const cle=location.hash.slice(1);if(cle.length<22){m.textContent='Lien incomplet : ouvrez le lien entier reçu par e-mail.';return}
const k=await crypto.subtle.importKey('raw',u(cle.slice(0,22)+'=='),'AES-GCM',false,['decrypt']),N=8,T=16417352;let fait=0;const out=[];
const un=async i=>{const r=await fetch('d/'+i+'.bin');if(!r.ok)throw 0;const d=new Uint8Array(await r.arrayBuffer());out[i]=await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12),additionalData:new Uint8Array([i])},k,d.slice(12));fait+=d.length;m.textContent='Chargement '+Math.min(100,Math.round(100*fait/T))+' %'};
let n=0;await Promise.all([0,1,2,3].map(async()=>{while(n<N)await un(n++)}));
p.src=URL.createObjectURL(new Blob(out,{type:'video/mp4'}));out.length=0;pret=true;b.hidden=false;m.textContent='Activez le son, puis lancez la vidéo';if(document.fullscreenEnabled||document.webkitFullscreenEnabled)f.hidden=false}
catch(e){m.textContent='La vidéo n’a pas pu se charger. Vérifiez le lien complet et rechargez la page.'}})();
})();
</script></body></html>
