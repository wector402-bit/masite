<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Réponses envoyées · Astroploy</title>
<link rel="icon" href="/img/favicon.png">
<style>
:root{--b:#2F6BFF;--g:#5f6368;--l:#e6e8ee;--bg:#f6f7fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#111;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:48px 16px 64px;text-align:center}
.top img{height:30px}
.card{margin-top:24px;background:#fff;border:1px solid var(--l);border-radius:20px;padding:36px 24px;box-shadow:0 18px 50px -24px rgba(20,30,60,.25)}
.ok{width:72px;height:72px;border-radius:50%;background:#e8f7ee;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
h1{font-size:clamp(24px,5vw,32px);letter-spacing:-.6px;line-height:1.2;margin:0 0 10px}
p{color:#333;font-size:17px;margin:8px 0}
.suite{margin-top:22px;text-align:left;background:#f3f6ff;border-radius:14px;padding:16px 18px;font-size:15px;color:#222}
.suite b{color:#1f55d9}
small{display:block;margin-top:22px;color:var(--g);font-size:14px}
</style></head><body><main>
<div class="top"><img src="/img/logo-black.png" alt="Astroploy"></div>
<div class="card">
  <div class="ok"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#1e9e57" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>Votre demande est bien envoyée</h1>
  <p>Merci ! Nous avons tout ce qu'il faut pour commencer.</p>
  <div class="suite"><b>La suite :</b> nous écrivons votre scénario et vous l'envoyons par e-mail pour validation sous 1 jour ouvré. Vous n'avez rien d'autre à faire d'ici là.</div>
  <small>Vous pouvez fermer cette page.</small>
</div>
</main>
<script>
// la page « merci » ne ramène pas au formulaire : le bouton retour reste ici
try{history.pushState(null,'',location.href);window.addEventListener('popstate',()=>history.pushState(null,'',location.href))}catch(e){}
</script></body></html>
